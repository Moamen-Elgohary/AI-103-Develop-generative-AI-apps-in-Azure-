<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flower Chatbot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #faf6f2;
    }

    h1 {
      text-align: center;
      margin-top: 24px;
      font-family: 'Playfair Display', serif;
      font-weight: 600;
      font-size: 2.5rem;
    }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 600px;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .bubble {
      max-width: 75%;
      padding: 10px 14px;
      border-radius: 16px;
      line-height: 1.4;
    }

    .question {
      align-self: flex-end;
      background: #cfe8d8;
    }

    .answer {
      align-self: flex-start;
      background: #eee;
    }

    #input-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 8px;
      padding: 16px;
      box-sizing: border-box;
    }

    #question {
      flex: 1;
      padding: 8px;
    }
  </style>
</head>
<body>
  <h1>Flower Chatbot</h1>

  <div id="chat"></div>

  <div id="input-bar">
    <input type="text" id="question" placeholder="Ask a question..." onkeydown="if(event.key==='Enter') ask()">
    <button id="ask-button" onclick="ask()">Ask</button>
    <button id="new-session-button" onclick="newSession()">New Session</button>
  </div>

  <script>
    let sessionId = null;

    async function ask() {
      const input = document.getElementById("question");
      const button = document.getElementById("ask-button");
      const question = input.value.trim();
      if (!question) return;

      const chat = document.getElementById("chat");

      const qBubble = document.createElement("div");
      qBubble.className = "bubble question";
      qBubble.textContent = question;
      chat.appendChild(qBubble);

      input.value = "";
      input.disabled = true;
      button.disabled = true;

      const thinkingBubble = document.createElement("div");
      thinkingBubble.className = "bubble answer";
      thinkingBubble.textContent = "Thinking...";
      chat.appendChild(thinkingBubble);
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, session_id: sessionId })
        });

        const data = await res.json();
        sessionId = data.session_id;
        thinkingBubble.textContent = data.answer;
      } catch (err) {
        thinkingBubble.textContent = "Something went wrong. Please try again.";
      } finally {
        chat.scrollTop = chat.scrollHeight;
        input.disabled = false;
        button.disabled = false;
        input.focus();
      }
    }

    async function newSession() {
      if (sessionId) {
        try {
          await fetch(`/session/${sessionId}`, { method: "DELETE" });
        } catch (err) {
          // ignore — clearing local state regardless
        }
      }
      sessionId = null;
      document.getElementById("chat").innerHTML = "";
    }
  </script>
</body>
</html>
